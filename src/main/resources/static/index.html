<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>アンケート</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            font-family: sans-serif;
        }

        .container {
            width: min(100%, 1000px);
            min-height: min(75dvh, 700px);
            max-height: 94dvh;
            overflow-y: auto;
            padding: clamp(20px, 4vw, 60px);
            background: white;
            border-radius: 32px;
            text-align: center;
            box-shadow: 0 8px 28px #00000015;
        }

        h1 {
            font-size: clamp(26px, 4vw, 48px);
            line-height: 1.35;
            margin: 0 0 20px;
        }

        p {
            color: #64748b;
            font-size: clamp(14px, 2vw, 20px);
            margin: 0 0 28px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: clamp(10px, 2vw, 20px);
        }

        button {
            min-width: 0;
            min-height: clamp(85px, 15dvh, 180px);
            padding: 12px;
            border: none;
            border-radius: 20px;
            font-size: clamp(23px, 4vw, 42px);
            font-weight: bold;
            color: white;
            background: #2563eb;
            cursor: pointer;
            touch-action: manipulation;
            overflow-wrap: anywhere;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:focus-visible {
            outline: 4px solid #0f172a;
            outline-offset: 3px;
        }

        button:disabled {
            opacity: 0.55;
            cursor: wait;
        }

        .female {
            background: #db2777;
        }

        .age-button {
            background: #16a34a;
        }

        .game-button {
            background: #f59e0b;
            color: #1f2937;
        }

        .back-button {
            width: 100%;
            min-height: 64px;
            margin-top: 20px;
            background: #64748b;
            font-size: clamp(20px, 3vw, 28px);
        }

        .hidden {
            display: none !important;
        }

        .error {
            margin-top: 20px;
            color: #b91c1c;
            font-weight: bold;
            font-size: 18px;
        }

        @media (min-width: 700px) {
            .gender-buttons {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .game-buttons {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-height: 600px) {
            body {
                align-items: flex-start;
            }

            .container {
                min-height: 0;
                max-height: none;
            }

            button {
                min-height: 70px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
<main class="container">

    <!-- 性別選択 -->
    <section id="gender-screen">
        <h1>性別を選択</h1>
        <p>該当するボタンを押してください</p>

        <div class="buttons gender-buttons">
            <button type="button"
                    onclick="selectGender('男性')">
                男性
            </button>
            <button type="button"
                    class="female"
                    onclick="selectGender('女性')">
                女性
            </button>
        </div>
    </section>

    <!-- 年代選択 -->
    <section id="age-screen" class="hidden">
        <h1>年代を選択</h1>
        <p>該当する年代を押してください</p>

        <div class="buttons">
            <button type="button" class="age-button"
                    onclick="selectAge('10代以下')">10代以下</button>
            <button type="button" class="age-button"
                    onclick="selectAge('20代')">20代</button>
            <button type="button" class="age-button"
                    onclick="selectAge('30代')">30代</button>
            <button type="button" class="age-button"
                    onclick="selectAge('40代')">40代</button>
            <button type="button" class="age-button"
                    onclick="selectAge('50代')">50代</button>
            <button type="button" class="age-button"
                    onclick="selectAge('60代以上')">60代以上</button>
        </div>

        <button type="button" class="back-button"
                onclick="backToGender()">戻る</button>
    </section>

    <!-- ゲーム選択 -->
    <section id="game-screen" class="hidden">
        <h1>一番面白かったゲームは？</h1>
        <p>該当するゲームを押してください</p>

        <div class="buttons game-buttons">
            <button type="button" class="game-button"
                    onclick="submitAnswer('Game1')">Game1</button>
            <button type="button" class="game-button"
                    onclick="submitAnswer('Game2')">Game2</button>
            <button type="button" class="game-button"
                    onclick="submitAnswer('Game3')">Game3</button>
            <button type="button" class="game-button"
                    onclick="submitAnswer('Game4')">Game4</button>
            <button type="button" class="game-button"
                    onclick="submitAnswer('Game5')">Game5</button>
            <button type="button" class="game-button"
                    onclick="submitAnswer('Game6')">Game6</button>
            <button type="button" class="game-button"
                    onclick="submitAnswer('Game7')">Game7</button>
            <button type="button" class="game-button"
                    onclick="submitAnswer('Game8')">Game8</button>
            <button type="button" class="game-button"
                    onclick="submitAnswer('Game9')">飛行機</button>
        </div>

        <button type="button" class="back-button"
                onclick="backToAge()">戻る</button>
    </section>

    <!-- 完了画面 -->
    <section id="complete-screen" class="hidden" aria-live="polite">
        <h1>回答ありがとうございます！</h1>
        <p>ご協力ありがとうございました。</p>
    </section>

    <!-- エラー表示 -->
    <p id="error-message" class="error hidden"
       role="alert"></p>

</main>

<script>
    "use strict";

    let selectedGender = "";
    let selectedAgeGroup = "";
    let isSubmitting = false;
    let completionTimer = null;

    const screenIds = [
        "gender-screen",
        "age-screen",
        "game-screen",
        "complete-screen"
    ];

    function showScreen(screenId) {
        screenIds.forEach(id => {
            document.getElementById(id).classList.toggle(
                "hidden",
                id !== screenId
            );
        });

        clearError();
    }

    function showError(message) {
        const error = document.getElementById("error-message");
        error.textContent = message;
        error.classList.remove("hidden");
    }

    function clearError() {
        const error = document.getElementById("error-message");
        error.textContent = "";
        error.classList.add("hidden");
    }

    function setGameButtonsDisabled(disabled) {
        document.querySelectorAll(".game-button").forEach(button => {
            button.disabled = disabled;
        });
    }

    function selectGender(gender) {
        if (isSubmitting) return;

        if (gender !== "男性" && gender !== "女性") return;

        selectedGender = gender;
        selectedAgeGroup = "";

        showScreen("age-screen");
    }

    function selectAge(ageGroup) {
        if (isSubmitting) return;

        const allowed = [
            "10代以下", "20代", "30代",
            "40代", "50代", "60代以上"
        ];

        if (!allowed.includes(ageGroup)) return;

        selectedAgeGroup = ageGroup;
        showScreen("game-screen");
    }

    async function submitAnswer(favoriteGame) {
        if (isSubmitting) return;

        if (!selectedGender || !selectedAgeGroup) {
            showError("性別と年代を選択し直してください。");
            showScreen("gender-screen");
            return;
        }

        const allowedGames = [
            "Game1", "Game2", "Game3",
            "Game4", "Game5", "Game6",
            "Game7", "Game8", "Game9"
        ];

        if (!allowedGames.includes(favoriteGame)) return;

        isSubmitting = true;
        setGameButtonsDisabled(true);
        clearError();

        try {
            const response = await fetch("/api/answers", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                cache: "no-store",
                body: JSON.stringify({
                    gender: selectedGender,
                    ageGroup: selectedAgeGroup,
                    favoriteGame: favoriteGame
                })
            });

            if (!response.ok) {
                throw new Error("保存に失敗しました");
            }

            showScreen("complete-screen");

            clearTimeout(completionTimer);

            completionTimer = setTimeout(() => {
                selectedGender = "";
                selectedAgeGroup = "";
                showScreen("gender-screen");
            }, 2000);

        } catch (error) {
            showError(
                "回答を保存できませんでした。通信状態を確認して、もう一度お試しください。"
            );
        } finally {
            isSubmitting = false;
            setGameButtonsDisabled(false);
        }
    }

    function backToGender() {
        if (isSubmitting) return;

        selectedGender = "";
        selectedAgeGroup = "";
        showScreen("gender-screen");
    }

    function backToAge() {
        if (isSubmitting) return;

        selectedAgeGroup = "";
        showScreen("age-screen");
    }
</script>
</body>
</html>
